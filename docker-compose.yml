services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ragam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragam}
      POSTGRES_DB: ${POSTGRES_DB:-ragam}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ragam} -d ${POSTGRES_DB:-ragam}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      LYRICS_AGENT_URL: http://lyrics-agent:8020
    volumes:
      - media_data:/app/storage
      - ./backend/app:/app/app
    ports:
      - "8010:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      lyrics-agent:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.workers.celery_app worker --loglevel=info
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    volumes:
      - media_data:/app/storage
      - ./backend/app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.workers.celery_app beat --loglevel=info
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    volumes:
      - ./backend/app:/app/app
    depends_on:
      redis:
        condition: service_healthy
      worker:
        condition: service_started

  lyrics-agent:
    build:
      context: ./services/lyrics-agent
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      CURSOR_API_KEY: ${CURSOR_API_KEY}
      CURSOR_LLM_MODEL: ${CURSOR_LLM_MODEL:-composer-2.5}
      CURSOR_IMAGE_MODEL: ${CURSOR_IMAGE_MODEL:-composer-2.5}
      LYRICS_BACKEND: ${LYRICS_BACKEND:-auto}
      CURSOR_CLI_PATH: ${CURSOR_CLI_PATH:-}
      PORT: 8020
    volumes:
      - ./services/lyrics-agent/src:/app/src
    ports:
      - "8020:8020"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8020/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8010
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

  n8n:
    image: n8nio/n8n:1.72.1
    env_file: .env
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:-changeme}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678/}
      GENERIC_TIMEZONE: Asia/Kolkata
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "5678:5678"
    depends_on:
      backend:
        condition: service_healthy
    profiles:
      - full

volumes:
  postgres_data:
  media_data:
  n8n_data:
